name: Custom Site CI

# Publishes the custom AIErudit-branded status page (status-site/) to gh-pages,
# baking in the latest Upptime data (history/summary.json) so the page reads it
# same-origin. Replaces the default Upptime "Static Site CI" (disabled).
on:
  push:
    branches: [master]
    paths:
      - "status-site/**"
      - "history/summary.json"
      - ".github/workflows/custom-site.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: custom-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r status-site/. _site/
          cp history/summary.json _site/summary.json
          echo "status.aierudit.com" > _site/CNAME
          touch _site/.nojekyll

      # Freshness evidence for the page: when this build ran and when Uptime CI
      # last succeeded. The page shows "Status unknown" instead of green when
      # either is older than 2 h (see ST_STALE_AFTER_MS in status-site/app.js).
      - name: Bake freshness.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // ""' 2>/dev/null || true)
          LAST="$last" python3 - <<'PY'
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          last = os.environ.get("LAST") or None
          with open("_site/freshness.json", "w") as f:
              json.dump({"generatedAt": now, "lastUptimeCheck": last}, f)
          print("freshness:", now, last)
          PY

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: custom status site"
